<!doctype html>
<!-- @dsCard group="Type" name="Type Scale" subtitle="Display / H1–H3 / Body / Caption" viewport="700x360" -->
<html><head><meta charset="utf-8"><title>Gofive — Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px 24px; background:#fff; color: var(--gf-fg-1); font-family: var(--gf-font-family); }
  .row { display:flex; align-items:baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--gf-line-4); }
  .row:last-child { border-bottom: 0; }
  .tag { width: 92px; font-size: 11px; color: var(--gf-fg-4); letter-spacing: 0.04em; text-transform: uppercase; }
  .spec { margin-left: auto; font-size: 11px; color: var(--gf-fg-5); font-variant-numeric: tabular-nums; }
</style></head>
<body>
  <div class="row"><span class="tag">Display</span><span style="font-size:40px;font-weight:700;line-height:1;letter-spacing:-0.015em;">Build what's next</span><span class="spec">40 / 700</span></div>
  <div class="row"><span class="tag">H1</span><span style="font-size:36px;font-weight:700;line-height:1;">Section heading</span><span class="spec">36 / 700</span></div>
  <div class="row"><span class="tag">H2</span><span style="font-size:24px;font-weight:600;">Subsection heading</span><span class="spec">24 / 600</span></div>
  <div class="row"><span class="tag">H3</span><span style="font-size:20px;font-weight:600;">Card heading</span><span class="spec">20 / 600</span></div>
  <div class="row"><span class="tag">Body Lg</span><span style="font-size:16px;">Larger body copy for emphasis</span><span class="spec">16 / 400</span></div>
  <div class="row"><span class="tag">Body</span><span style="font-size:14px;">Default body — used everywhere in product</span><span class="spec">14 / 400</span></div>
  <div class="row"><span class="tag">Small</span><span style="font-size:12px;color:var(--gf-fg-3);">Helper text, table cells</span><span class="spec">12 / 400</span></div>
  <div class="row"><span class="tag">Caption</span><span style="font-size:10px;color:var(--gf-fg-4);text-transform:uppercase;letter-spacing:0.06em;">META · LABEL</span><span class="spec">10 / 400</span></div>
</body></html>
