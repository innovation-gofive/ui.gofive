<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type · display" subtitle="Display, H1, H2, H3 in Gofive" viewport="700x200" --><html><head>
<meta charset="utf-8"><title>Type display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--gf-bg-1);font-family:var(--gf-font-family);color:var(--gf-fg-1);}
.wrap{padding:22px 28px;}
.row{display:flex;align-items:baseline;gap:16px;margin-bottom:6px;}
.label{font-size:10px;color:var(--gf-fg-5);min-width:56px;font-weight:500;letter-spacing:.02em;}
.display{font-size:40px;font-weight:700;letter-spacing:-0.02em;line-height:1.02;}
.h1{font-size:32px;font-weight:700;letter-spacing:-0.01em;line-height:1.08;}
.h2{font-size:22px;font-weight:600;line-height:1.15;}
.h3{font-size:16px;font-weight:600;line-height:1.25;}
</style></head><body>
<div class="wrap">
  <div class="row"><span class="label">Display</span><span class="display">Work that matters.</span></div>
  <div class="row"><span class="label">H1 / 32</span><span class="h1">Human‑first HR, at scale</span></div>
  <div class="row"><span class="label">H2 / 22</span><span class="h2">Performance reviews done right</span></div>
  <div class="row"><span class="label">H3 / 16</span><span class="h3">Monthly payroll summary</span></div>
</div>
</body></html>
