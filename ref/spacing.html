<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing" subtitle="4 px grid — 1 → 12" viewport="700x330" --><html><head>
<meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--gf-bg-1);font-family:var(--gf-font-sans);color:var(--gf-fg-1);}
.wrap{padding:22px 24px;}
.h{font-size:10px;color:var(--gf-fg-5);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;}
.row{display:flex;flex-direction:column;gap:8px;}
.unit{display:flex;align-items:center;gap:12px;}
.bar{background:var(--gf-flame);height:14px;border-radius:3px;}
.tok{font-family:var(--gf-font-mono);font-size:11px;color:var(--gf-fg-3);min-width:80px;}
.px{font-size:10px;color:var(--gf-fg-5);min-width:40px;}
</style></head><body>
<div class="wrap">
  <div class="h">Spacing · 4px base</div>
  <div class="row">
    <div class="unit"><span class="tok">--gf-space-1</span><div class="bar" style="width:4px;"></div><span class="px">4px</span></div>
    <div class="unit"><span class="tok">--gf-space-2</span><div class="bar" style="width:8px;"></div><span class="px">8px</span></div>
    <div class="unit"><span class="tok">--gf-space-3</span><div class="bar" style="width:12px;"></div><span class="px">12px</span></div>
    <div class="unit"><span class="tok">--gf-space-4</span><div class="bar" style="width:16px;"></div><span class="px">16px</span></div>
    <div class="unit"><span class="tok">--gf-space-5</span><div class="bar" style="width:20px;"></div><span class="px">20px</span></div>
    <div class="unit"><span class="tok">--gf-space-6</span><div class="bar" style="width:24px;"></div><span class="px">24px</span></div>
    <div class="unit"><span class="tok">--gf-space-8</span><div class="bar" style="width:32px;"></div><span class="px">32px</span></div>
    <div class="unit"><span class="tok">--gf-space-10</span><div class="bar" style="width:40px;"></div><span class="px">40px</span></div>
    <div class="unit"><span class="tok">--gf-space-12</span><div class="bar" style="width:48px;"></div><span class="px">48px</span></div>
    <div class="unit"><span class="tok">--gf-space-16</span><div class="bar" style="width:64px;"></div><span class="px">64px</span></div>
  </div>
</div>
</body></html>
