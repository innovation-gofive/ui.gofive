<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Ink → bg ramp" viewport="700x250" -->
<html><head><meta charset="utf-8"><title>Gofive — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px; background:#fff; font-family: var(--gf-font-family); }
  .row { display:grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
  .sw { border-radius: 8px; overflow: hidden; border: 1px solid var(--gf-line-4); }
  .chip { height: 56px; }
  .meta { padding: 6px 8px; font-size: 10px; color: var(--gf-fg-4); }
  .name { display:block; color: var(--gf-fg-1); font-weight: 600; font-size: 11px; }
  .hex { font-variant-numeric: tabular-nums; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#1C1C22"></div><div class="meta"><span class="name">Ink</span><span class="hex">#1C1C22</span></div></div>
    <div class="sw"><div class="chip" style="background:#383842"></div><div class="meta"><span class="name">fg-2</span><span class="hex">#383842</span></div></div>
    <div class="sw"><div class="chip" style="background:#52525F"></div><div class="meta"><span class="name">fg-3</span><span class="hex">#52525F</span></div></div>
    <div class="sw"><div class="chip" style="background:#6A6A7C"></div><div class="meta"><span class="name">fg-4</span><span class="hex">#6A6A7C</span></div></div>
    <div class="sw"><div class="chip" style="background:#83839A"></div><div class="meta"><span class="name">fg-5</span><span class="hex">#83839A</span></div></div>
    <div class="sw"><div class="chip" style="background:#A5A5B6"></div><div class="meta"><span class="name">fg-6</span><span class="hex">#A5A5B6</span></div></div>
    <div class="sw"><div class="chip" style="background:#D2D2DA"></div><div class="meta"><span class="name">line-1</span><span class="hex">#D2D2DA</span></div></div>
    <div class="sw"><div class="chip" style="background:#DFDFE8"></div><div class="meta"><span class="name">line-2</span><span class="hex">#DFDFE8</span></div></div>
    <div class="sw"><div class="chip" style="background:#ECECF1"></div><div class="meta"><span class="name">line-4</span><span class="hex">#ECECF1</span></div></div>
  </div>
  <div class="row" style="margin-top:10px; grid-template-columns: repeat(5, 1fr);">
    <div class="sw"><div class="chip" style="background:#F6F6F8"></div><div class="meta"><span class="name">bg-2 (surface)</span><span class="hex">#F6F6F8</span></div></div>
    <div class="sw"><div class="chip" style="background:#F5F5F5"></div><div class="meta"><span class="name">bg-3 (app)</span><span class="hex">#F5F5F5</span></div></div>
    <div class="sw"><div class="chip" style="background:#EFEFEF"></div><div class="meta"><span class="name">bg-4</span><span class="hex">#EFEFEF</span></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF; border:1px dashed var(--gf-line-2);"></div><div class="meta"><span class="name">white</span><span class="hex">#FFFFFF</span></div></div>
    <div class="sw"><div class="chip" style="background:#000000"></div><div class="meta"><span class="name">black</span><span class="hex">#000000</span></div></div>
  </div>
</body></html>
