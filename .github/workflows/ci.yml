name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node 22 ships npm 10, which rejects lockfiles written by npm 11 (same as the Dockerfile)
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:registry
      # public/r is committed; fail if it is stale against registry.json and the sources.
      - run: npm run registry:build
      - run: git diff --exit-code -- public/r
      - run: npm run build
